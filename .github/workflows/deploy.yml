name: Build and Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Write version.json
        run: |
          mkdir -p public
          printf '{"commit":"%s","buildTime":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/version.json
      - name: Build
        run: npm run build
      - name: Stage dist to repo root (legacy Pages serves root)
        run: |
          # 清掉根目录旧静态产物，保留源码目录
          rm -rf assets version.json
          cp -r dist/. .
          # 移除 Vite 源码入口 index.html，用构建产物覆盖（已在上面 cp）
          ls -la
      - name: Commit dist to main
        run: |
          git config user.name "pi-agent"
          git config user.email "pi-agent@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: build dist for legacy Pages"
          git push origin main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4